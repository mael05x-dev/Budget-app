<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#173F2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --ink:#1C2B2E; --sub:#68716E; --line:#E3E0D6;
  --accent:#2F6F5E; --accent-soft:#DCEAE4; --warn:#B5482A; --warn-soft:#F3E1D8;
  --info:#2E6FA6; --info-soft:#DCEAF7;
  --serif:'Fraunces', Georgia, 'Times New Roman', serif;
  --sans:'Inter', -apple-system, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181A; --surface:#1D2325; --ink:#EDEBE4; --sub:#9AA3A0; --line:#2C3335;
    --accent:#5FA893; --accent-soft:#22322D; --warn:#D9724F; --warn-soft:#382420;
    --info:#6BA6D9; --info-soft:#1E2E3B;
  }
}
:root[data-theme="dark"]{
  --bg:#14181A; --surface:#1D2325; --ink:#EDEBE4; --sub:#9AA3A0; --line:#2C3335;
  --accent:#5FA893; --accent-soft:#22322D; --warn:#D9724F; --warn-soft:#382420;
  --info:#6BA6D9; --info-soft:#1E2E3B;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); min-height:100%;}
.topbar{padding:18px 20px 10px; padding-top:calc(18px + env(safe-area-inset-top,0px)); position:sticky; top:0; background:var(--bg); z-index:5; border-bottom:1px solid var(--line);}
.topbar h1{font-family:var(--serif); font-weight:600; font-size:22px; margin:0;}
main{padding:16px 16px 90px; max-width:520px; margin:0 auto;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px;}
.hero{margin-bottom:16px;}
.month-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.month-nav button{background:none; border:1px solid var(--line); border-radius:8px; width:34px; height:34px; font-size:16px; color:var(--ink); cursor:pointer;}
.month-nav .label{font-size:14px; color:var(--sub); text-transform:capitalize;}
.total-amount{font-family:var(--serif); font-size:38px; font-weight:600; line-height:1.1; margin:2px 0 4px;}
.total-label{font-size:13px; color:var(--sub);}
.reste-line{font-size:14px; color:var(--sub); margin-top:2px;}
.reste-line b{color:var(--warn); font-family:var(--serif); font-weight:600; font-size:15px;}
.breakdown{display:flex; gap:14px; margin-top:14px; flex-wrap:wrap; font-size:13px; color:var(--sub);}
.breakdown b{color:var(--ink); font-weight:600;}
.section-title{font-size:14px; color:var(--sub); margin:22px 0 10px;}
.echeance-toggle{display:flex; align-items:center; justify-content:space-between; cursor:pointer;}
.echeance-toggle .chev{font-size:11px;}
.row{display:flex; align-items:center; gap:10px; padding:12px 4px; border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:none;}
.day-badge{width:38px; height:38px; border-radius:10px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; flex-shrink:0;}
.row-main{flex:1; min-width:0;}
.row-name{font-size:15px; font-weight:500;}
.row-sub{font-size:12px; color:var(--sub); margin-top:1px; display:flex; align-items:center;}
.row-amount{font-family:var(--serif); font-size:16px; font-weight:600; white-space:nowrap;}
.cat-dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; flex-shrink:0;}
.cat-section{display:flex; align-items:center;}
.empty{text-align:center; padding:34px 16px; color:var(--sub); font-size:14px; line-height:1.5;}
.empty strong{display:block; color:var(--ink); font-family:var(--serif); font-size:17px; margin-bottom:4px; font-weight:600;}
.fab-row{display:flex; justify-content:flex-end; margin-bottom:4px;}
.btn{background:var(--accent); color:#fff; border:none; border-radius:10px; padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer; font-family:var(--sans);}
.btn.secondary{background:none; color:var(--sub); border:1px solid var(--line);}
.btn.small{padding:7px 12px; font-size:12px; margin-top:10px;}
form.entry{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px;}
form.entry .field{margin-bottom:12px;}
form.entry label{display:block; font-size:12px; color:var(--sub); margin-bottom:5px;}
form.entry input, form.entry select{width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font-size:15px; font-family:var(--sans);}
form.entry.compact{padding:12px; margin-bottom:10px;}
form.entry.compact .field{margin-bottom:8px;}
form.entry.compact .actions{margin-top:8px; gap:8px;}
form.entry.compact .actions .btn{margin-top:0;}
form.entry.compact .cat-grid{grid-template-columns:1fr auto; gap:10px; align-items:end;}
form.entry.compact .cat-color-field{margin-bottom:8px;}
form.entry input.color-swatch{-webkit-appearance:none; appearance:none; width:48px; height:48px; padding:0; border:none; background:none; cursor:pointer;}
form.entry.compact input.color-swatch{width:38px; height:38px;}
form.entry input.color-swatch::-webkit-color-swatch-wrapper{padding:0; border-radius:50%; overflow:hidden;}
form.entry input.color-swatch::-webkit-color-swatch{border:2px solid var(--line); border-radius:50%;}
form.entry input.color-swatch::-moz-color-swatch{border:2px solid var(--line); border-radius:50%;}
form.entry .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
form.entry .actions{display:flex; gap:10px; margin-top:14px;}
form.mini{background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px; margin-top:10px;}
form.mini .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;}
form.mini input{padding:8px 9px; border:1px solid var(--line); border-radius:7px; background:var(--surface); color:var(--ink); font-size:13px; width:100%; font-family:var(--sans);}
form.mini .actions{display:flex; gap:8px;}
.tag{font-size:11px; padding:2px 8px; border-radius:20px; background:var(--accent-soft); color:var(--accent); font-weight:600; flex-shrink:0;}
.tag.warn{background:var(--warn-soft); color:var(--warn);}
.del{background:none; border:none; color:var(--sub); font-size:18px; cursor:pointer; padding:4px 6px; line-height:1;}
.tabbar{position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom,0px); z-index:5;}
.tab{flex:1; background:none; border:none; padding:13px 4px 10px; color:var(--sub); font-size:12px; font-family:var(--sans); cursor:pointer; font-weight:500;}
.tab.active{color:var(--accent); font-weight:700;}
.row.paid{opacity:.5;}
.row.paid .row-name{font-size:13px;}
.check-dot{width:26px; height:26px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0;}
.row.due{background:var(--accent-soft); border-radius:12px; padding:16px 10px; margin:4px 0; border-bottom:none;}
.row.due .row-name{font-size:16.5px; font-weight:700;}
.row.due .row-amount{font-size:18px;}
.day-badge.due-badge{background:var(--accent); color:#fff;}
.row.info{background:var(--info-soft); border-radius:12px; padding:16px 10px; margin:4px 0; border-bottom:none;}
.row.info .row-name{font-size:16.5px; font-weight:700;}
.row.info .row-amount{font-size:18px;}
.day-badge.info-badge{background:var(--info); color:#fff;}
.icon-btn.info-btn{background:var(--info); color:#fff;}
.icon-btn{border:none; border-radius:8px; width:32px; height:32px; font-size:15px; cursor:pointer; flex-shrink:0;}
.icon-btn.ok{background:var(--accent); color:#fff;}
.icon-btn.no{background:var(--warn); color:#fff;}
.icon-btn.ghost{background:none; color:var(--sub); font-size:21px; width:38px; height:38px; display:flex; align-items:center; justify-content:center;}
.menu button{min-height:44px;}
.due-actions{display:flex; gap:6px;}
.menu-wrap{position:relative; flex-shrink:0;}
.menu{position:absolute; right:0; top:30px; background:var(--surface); border:1px solid var(--line); border-radius:8px; box-shadow:0 4px 14px rgba(0,0,0,.15); z-index:10; overflow:hidden;}
.menu button{display:block; width:100%; white-space:nowrap; padding:10px 14px; background:none; border:none; text-align:left; font-size:13px; color:var(--ink); cursor:pointer;}
.pepette-row{display:flex; align-items:center; justify-content:space-between; margin-top:10px; font-size:13px; color:var(--sub);}
.solde-input{width:110px; text-align:right; padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font-size:14px; font-family:var(--sans);}
.revenu-list{margin-top:8px;}
.revenu-item{display:flex; align-items:center; gap:8px; font-size:13px; padding:6px 0; border-top:1px solid var(--line);}
.revenu-item span:first-child{flex:1;}
.echeance-list{max-height:340px; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.pie-wrap{display:flex; justify-content:center; margin:16px 0 6px;}
.pie{width:140px; height:140px; border-radius:50%; flex-shrink:0;}
.pie-legend{margin-top:4px;}
.legend-row{display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13px; border-top:1px solid var(--line);}
.legend-row:first-child{border-top:none;}
.legend-name{flex:1;}
.legend-pct{color:var(--sub); width:38px; text-align:right;}
.legend-amt{font-family:var(--serif); font-weight:600; width:62px; text-align:right;}
.archive-card .row{opacity:.5;}
.archive-card .row-name{font-size:13px;}
.muted{color:var(--sub); font-size:13px; padding:6px 2px;}
.confirm-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; align-items:center; justify-content:center; padding:20px;}
.confirm-overlay.open{display:flex;}
.confirm-box{background:var(--surface); border-radius:14px; padding:20px; max-width:340px; width:100%;}
.confirm-box p{margin:0 0 16px; font-size:15px; color:var(--ink); line-height:1.4;}
.confirm-actions{display:flex; gap:10px;}
.confirm-actions .btn{flex:1;}
.btn.warn-btn{background:var(--warn);}
.topbar{display:flex; align-items:center; justify-content:space-between;}
.title-icon{width:40px; height:40px; vertical-align:middle; margin-right:8px; object-fit:contain;}
.menu-icon-img{width:24px; height:24px; object-fit:contain;}
.icon-btn.accent-badge{background:var(--accent); border-radius:50%;}
.check-row{display:flex; align-items:center; gap:8px; margin-top:8px; font-size:12px; color:var(--sub); cursor:pointer; user-select:none; font-weight:400;}
.check-native{position:absolute; opacity:0; width:1px; height:1px;}
.check-box{display:inline-block; width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line); background:var(--surface); flex-shrink:0; position:relative; transition:background .15s, border-color .15s;}
.check-native:checked + .check-box{background:var(--accent); border-color:var(--accent);}
.check-native:checked + .check-box::after{content:''; position:absolute; left:6px; top:2px; width:5px; height:10px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg);}
.popover{position:absolute; right:0; top:38px; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:0 4px 14px rgba(0,0,0,.18); z-index:20; padding:14px; width:230px;}
.popover label{display:block; font-size:12px; color:var(--sub); margin-bottom:6px;}
.popover input{width:100%; padding:8px 9px; border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--ink); font-size:14px; margin-bottom:10px; font-family:var(--sans);}
.tabbar{position:fixed; bottom:0; left:0; right:0; height:72px; padding-bottom:env(safe-area-inset-bottom,0px); z-index:5; background:none; border:none; display:block;}
.tabbar-wave{position:absolute; inset:0; width:100%; height:100%; display:block;}
.tabbar-row{position:relative; display:flex; height:100%; z-index:1;}
.tab{flex:1; background:none; border:none; padding:0; color:var(--sub); font-size:11px; font-family:var(--sans); cursor:pointer; font-weight:500; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:10px; position:relative;}
.tab.active{color:var(--accent); font-weight:700;}
.tab-icon{position:absolute; top:-2px; width:38px; height:38px; border-radius:50%; background:var(--surface); box-shadow:0 3px 8px rgba(0,0,0,.16); display:flex; align-items:center; justify-content:center; padding:6px; border:2px solid var(--bg);}
.tab.active .tab-icon{box-shadow:0 3px 10px rgba(47,111,94,.35); border-color:var(--accent-soft);}
.tab-icon img{width:100%; height:100%; object-fit:contain;}
.tab-label{margin-top:24px;}
</style>
</head>

<script>
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const fmt = n => new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(n||0);
const CATEGORIES = ['Assurance + Banque','Abonnement','Habitation','Exceptionnel','Épargne','Autre'];
const CATS = {
  'Assurance + Banque': {bg:'#DCEAF7', text:'#2E5F8A', dot:'#5B9BD5'},
  'Abonnement':         {bg:'#DCEAF7', text:'#2E5F8A', dot:'#5B9BD5'},
  'Habitation':         {bg:'#DCEAF7', text:'#2E5F8A', dot:'#5B9BD5'},
  'Exceptionnel':       {bg:'#FFF3D6', text:'#8A6D00', dot:'#FFC000'},
  'Épargne':            {bg:'#E4F1DC', text:'#3F7A2E', dot:'#70AD47'},
  'Autre':              {bg:'#E9E7E0', text:'#68716E', dot:'#9AA3A0'}
};
const EXCEPT_COLOR = {bg:'#FFF3D6', text:'#8A6D00', dot:'#FFC000'};
const EPARGNE_COLOR = {bg:'#E4F1DC', text:'#3F7A2E', dot:'#70AD47'};
const SEED_CHARGES = [
  {nom:'AGPM - Voiture', montant:86, jour:2,  categorie:'Assurance + Banque'},
  {nom:'Prévoyance',     montant:20, jour:1,  categorie:'Assurance + Banque'},
  {nom:'Allianz',        montant:6,  jour:1,  categorie:'Assurance + Banque'},
  {nom:'SG - Sobrio',    montant:8,  jour:1,  categorie:'Assurance + Banque'},
  {nom:'Youtube',        montant:13, jour:20, categorie:'Abonnement'},
  {nom:'Netflix',        montant:15, jour:13, categorie:'Abonnement'},
  {nom:'Spotify',        montant:18, jour:1,  categorie:'Abonnement'},
  {nom:'Free Mobile',    montant:20, jour:17, categorie:'Abonnement'},
  {nom:'Locakase',       montant:52, jour:1,  categorie:'Habitation'},
  {nom:'Permis moto',    montant:260,jour:1,  categorie:'Exceptionnel'},
  {nom:'Impot',          montant:96, jour:1,  categorie:'Exceptionnel'},
  {nom:'MPP',            montant:300,jour:1,  categorie:'Épargne', typeEpargne:'Virement'},
  {nom:'Livret A',       montant:200,jour:1,  categorie:'Épargne', typeEpargne:'Virement'}
];
const CHARGE_CATEGORIES = CATEGORIES.filter(c=>c!=='Épargne');
const TYPES_EPARGNE = ['Virement','Assurance vie','Livret','PEA','Autre'];

function getCatInfo(name){
  if(name==='Épargne') return EPARGNE_COLOR;
  if(name==='Exceptionnel') return EXCEPT_COLOR;
  const c = (state.categories||[]).find(cc=>cc.name===name);
  if(c) return {dot:c.color, text:c.color, bg:c.color+'22'};
  return {dot:'#9AA3A0', text:'#68716E', bg:'#E9E7E0'};
}
function getChargeCategories(){ return (state.categories||[]).map(c=>c.name); }

function jourFieldHtml(id, val, opts){
  opts = opts || {};
  const label = opts.label || 'Jour de prélèvement';
  const noDate = (val===undefined || val===null || val==='');
  return `
  <div class="field">
    <label>${label}</label>
    <input id="${id}" type="number" min="1" max="31" value="${noDate?'':val}" ${noDate?'disabled':''}>
    <label class="check-row">
      <input class="check-native" type="checkbox" id="${id}-nodate" ${noDate?'checked':''} onchange="toggleNoDateField('${id}')">
      <span class="check-box"></span>
      <span>Pas de date de prélèvement précise</span>
    </label>
  </div>`;
}
function toggleNoDateField(id){
  const cb = document.getElementById(id+'-nodate');
  const inp = document.getElementById(id);
  inp.disabled = cb.checked;
  if(cb.checked) inp.value='';
}
function readJourField(id){
  const cb = document.getElementById(id+'-nodate');
  if(cb && cb.checked) return '';
  const inp = document.getElementById(id);
  return inp ? inp.value : '';
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem('budget_v1'));
    if(s && s.charges){
      if(!s.paidStatus) s.paidStatus={};
      if(!s.exceptionnelles) s.exceptionnelles=[];
      if(!s.soldeByMonth) s.soldeByMonth={};
      if(!s.revenus) s.revenus=[];
      if(!s.categories){
        s.categories = CATEGORIES.filter(c=>c!=='Épargne').map(name=>({name, color:CATS[name].dot}));
        (s.customCategories||[]).forEach(cc=>{ if(!s.categories.some(c=>c.name===cc.name)) s.categories.push({name:cc.name, color:cc.color}); });
      }
      if(!s.payday) s.payday=25;
      return s;
    }
  }catch(e){}
  return {
    charges: SEED_CHARGES.map(c=>({id:uid(), nom:c.nom, montant:c.montant, jour:c.jour, categorie:c.categorie, frequence:'mensuel', mois:'', moisUnique:'', typeEpargne:c.typeEpargne||''})),
    exceptionnelles: [], paidStatus: {}, soldeByMonth: {}, revenus: [],
    categories: CATEGORIES.filter(c=>c!=='Épargne').map(name=>({name, color:CATS[name].dot})),
    payday: 25
  };
}
let state = loadState();
function save(){ try{ localStorage.setItem('budget_v1', JSON.stringify(state)); }catch(e){} }

const today = new Date();
function currentCycle(){
  let y=today.getFullYear(), m=today.getMonth()+1;
  if(today.getDate() >= (state.payday||25)){ m+=1; if(m>12){m=1;y+=1;} }
  return {year:y, month:m};
}
const cc0 = currentCycle();
let viewMonth = new Date(cc0.year, cc0.month-1, 1); viewMonth.setHours(0,0,0,0);

let confirmAction = null;
function askConfirm(message, fn){
  confirmAction = fn;
  document.getElementById('confirm-message').textContent = message;
  document.getElementById('confirm-overlay').classList.add('open');
}
function closeConfirm(){
  confirmAction = null;
  document.getElementById('confirm-overlay').classList.remove('open');
}
document.getElementById('confirm-yes').addEventListener('click', ()=>{
  const fn = confirmAction;
  closeConfirm();
  if(fn) fn();
});

let tab = 'apercu';
let editingCharge=null, editingExcept=null, showChargeForm=false, showExceptForm=false, openMenuFor=null, echeancesOpen=false, showRevenuForm=false;

function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function keyFor(kind,id){ return kind+'_'+id+'_'+monthKey(viewMonth); }

// Renvoie la date calendaire réelle d'une échéance de jour `jour` au sein du cycle (viewYear, viewMonth).
// Le cycle "M" couvre du 25 du mois M-1 au 24 du mois M : un jour >= 25 appartient donc au mois calendaire précédent.
function occurrenceDate(viewYear, viewMonth1, jour){
  if(jour < (state.payday||25)) return {year:viewYear, month:viewMonth1, day:jour};
  let m = viewMonth1-1, y = viewYear;
  if(m<1){ m=12; y-=1; }
  return {year:y, month:m, day:jour};
}

function hasJourVal(v){ return v!=='' && v!=null; }
function itemsForMonth(d){
  const vy = d.getFullYear(), vm = d.getMonth()+1;
  const items = [];
  state.charges.forEach(c=>{
    const hj = hasJourVal(c.jour);
    if(c.frequence==='mensuel'){
      const occ = hj ? occurrenceDate(vy, vm, +c.jour) : {year:vy, month:vm, day:1};
      items.push({id:c.id, nom:c.nom, montant:+c.montant, jour:hj?+c.jour:null, occ, type:'Mensuelle', kind:'charge', categorie:c.categorie, noDate:!hj});
    } else if(c.frequence==='unique'){
      if(c.moisUnique === monthKey(d)){
        const occ = hj ? occurrenceDate(vy, vm, +c.jour) : {year:vy, month:vm, day:1};
        items.push({id:c.id, nom:c.nom, montant:+c.montant, jour:hj?+c.jour:null, occ, type:'Ponctuelle', kind:'charge', categorie:c.categorie, noDate:!hj});
      }
    } else {
      if(hj){
        const occ = occurrenceDate(vy, vm, +c.jour);
        if(occ.month === +c.mois){
          items.push({id:c.id, nom:c.nom, montant:+c.montant, jour:+c.jour, occ, type:'Annuelle', kind:'charge', categorie:c.categorie, noDate:false});
        }
      } else if(vm === +c.mois){
        items.push({id:c.id, nom:c.nom, montant:+c.montant, jour:null, occ:{year:vy,month:vm,day:1}, type:'Annuelle', kind:'charge', categorie:c.categorie, noDate:true});
      }
    }
  });
  state.exceptionnelles.forEach(e=>{
    const [y,m] = e.moisDebut.split('-').map(Number);
    const startIdx = y*12+(m-1), curIdx = vy*12+(vm-1);
    const offset = curIdx - startIdx;
    if(offset>=0 && offset < +e.duree){
      const hj = hasJourVal(e.jour);
      const jourE = hj ? +e.jour : null;
      const occ = hj ? occurrenceDate(vy, vm, jourE) : {year:vy, month:vm, day:1};
      items.push({id:e.id, nom:e.nom, montant:+e.montant, jour:jourE, occ, type:'Exceptionnelle ('+(offset+1)+'/'+e.duree+')', kind:'except', categorie:null, noDate:!hj});
    }
  });
  items.sort((a,b)=> occValue(a.occ)-occValue(b.occ));
  return items;
}
function occValue(o){ return o.year*372 + o.month*31 + o.day; }

function markPaid(key){ state.paidStatus[key]='paid'; save(); openMenuFor=null; renderApercu(); }
function dismissDue(key){ state.paidStatus[key]='dismissed'; save(); renderApercu(); }
function unmarkPaid(key){ delete state.paidStatus[key]; save(); openMenuFor=null; renderApercu(); }
function toggleMenu(key){ openMenuFor=(openMenuFor===key)?null:key; render(); }
function toggleEcheances(){ echeancesOpen=!echeancesOpen; renderApercu(); }

function itemRowHtml(i){
  const cat = i.categorie ? getCatInfo(i.categorie) : EXCEPT_COLOR;
  const catLabel = i.categorie ? `<span class="cat-dot" style="background:${cat.dot}"></span>${i.categorie} · ` : '';
  if(i.status==='paid'){
    return `<div class="row paid">
      <div class="check-dot">✓</div>
      <div class="row-main"><div class="row-name">${escapeHtml(i.nom)}</div><div class="row-sub">${catLabel}${i.type} · débité</div></div>
      <div class="row-amount">${fmt(i.montant)}</div>
      <div class="menu-wrap">
        <button class="icon-btn ghost" onclick="toggleMenu('${i.key}')">⋮</button>
        ${openMenuFor===i.key ? `<div class="menu"><button onclick="unmarkPaid('${i.key}')">Annuler le débit</button></div>` : ''}
      </div>
    </div>`;
  }
  if(i.showDue){
    return `<div class="row due">
      <div class="day-badge due-badge">${String(i.jour).padStart(2,'0')}</div>
      <div class="row-main"><div class="row-name">${escapeHtml(i.nom)}</div><div class="row-sub">${catLabel}${i.type}</div></div>
      <div class="row-amount">${fmt(i.montant)}</div>
      <div class="due-actions">
        <button class="icon-btn ok" onclick="markPaid('${i.key}')" title="Débité">✓</button>
      </div>
    </div>`;
  }
  return `<div class="row">
    <div class="day-badge">${String(i.jour).padStart(2,'0')}</div>
    <div class="row-main"><div class="row-name">${escapeHtml(i.nom)}</div><div class="row-sub">${catLabel}${i.type}</div></div>
    <div class="row-amount">${fmt(i.montant)}</div>
    <div class="menu-wrap">
      <button class="icon-btn ghost" onclick="toggleMenu('${i.key}')">⋮</button>
      ${openMenuFor===i.key ? `<div class="menu"><button onclick="markPaid('${i.key}')">Marquer débité</button></div>` : ''}
    </div>
  </div>`;
}

function togglePaydayMenu(){
  const el = document.getElementById('payday-popover');
  const opening = el.style.display==='none' || !el.style.display;

function renderApercu(){
  const allItems = itemsForMonth(viewMonth);
  const items = allItems.filter(i=>!i.noDate);
  const noDateItems = allItems.filter(i=>i.noDate);
  const todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate()).getTime();
  let enriched = items.map(i=>{
    const key = keyFor(i.kind, i.id);
    const status = state.paidStatus[key];
    const dueDate = new Date(i.occ.year, i.occ.month-1, i.occ.day).getTime();
    const due = dueDate <= todayMid;
    const showDue = due && status!=='paid' && status!=='dismissed';
    return Object.assign({}, i, {key, status, showDue});
  });
  enriched.sort((a,b)=>{
    if((a.status==='paid') !== (b.status==='paid')) return a.status==='paid' ? -1 : 1;
    return occValue(a.occ) - occValue(b.occ);
  });
  const total = allItems.reduce((s,i)=>s+i.montant,0);
  const reste = enriched.filter(i=>i.status!=='paid').reduce((s,i)=>s+i.montant,0);
  const byType = {Mensuelle:0, Annuelle:0}; let exceptTotal=0;
  allItems.forEach(i=>{ if(i.kind==='except') exceptTotal+=i.montant; else byType[i.type]+=i.montant; });

  const mk = monthKey(viewMonth);
  const revenusForMonth = state.revenus.filter(r=>r.mois===mk);
  const revenusTotal = revenusForMonth.reduce((s,r)=>s+ +r.montant,0);
  const solde = state.soldeByMonth[mk] || 0;
  const pepette = solde + revenusTotal - total;

  const unpaidSorted = enriched.filter(i=>i.status!=='paid').slice().sort((a,b)=>occValue(a.occ)-occValue(b.occ));
  const displayList = echeancesOpen ? enriched : (unpaidSorted[0] ? [unpaidSorted[0]] : enriched.slice(0,1));
  const rowsInner = displayList.map(itemRowHtml).join('');
  const rowsHtml = items.length
    ? (echeancesOpen ? `<div class="echeance-list">${rowsInner}</div>` : rowsInner)
    : `<div class="empty"><strong>Rien à payer ce cycle-ci</strong>Ajoute une charge ou une dépense exceptionnelle pour la voir apparaître ici.</div>`;

  const catTotals = {};
  allItems.forEach(i=>{ const cat = i.categorie || '__except__'; catTotals[cat] = (catTotals[cat]||0) + i.montant; });
  const pieCats = Object.keys(catTotals);
  const catOrder = key => key==='__except__' ? 2 : (key==='Épargne' ? 1 : 0);
  pieCats.sort((a,b)=>catOrder(a)-catOrder(b));
  function catDisplay(key){ return key==='__except__' ? {info:EXCEPT_COLOR, label:'Exceptionnel'} : {info:getCatInfo(key), label:key}; }
  let acc = 0;
  const gradientStops = pieCats.map(cat=>{ const amt=catTotals[cat]; const pct=total?amt/total*100:0; const {info}=catDisplay(cat); const seg=`${info.dot} ${acc.toFixed(2)}% ${(acc+pct).toFixed(2)}%`; acc+=pct; return seg; }).join(', ');
  const legendHtml = pieCats.map(cat=>{ const amt=catTotals[cat]; const pct = total ? Math.round(amt/total*1000)/10 : 0; const {info,label}=catDisplay(cat); return `<div class="legend-row"><span class="cat-dot" style="background:${info.dot}"></span><span class="legend-name">${label}</span><span class="legend-pct">${pct}%</span><span class="legend-amt">${fmt(amt)}</span></div>`; }).join('');
  const pieHtml = total>0 ? `<div class="pie-wrap"><div class="pie" style="background:conic-gradient(${gradientStops})"></div></div><div class="pie-legend">${legendHtml}</div>` : '';

  const noDateEnriched = noDateItems.map(i=>{
    const key = keyFor(i.kind, i.id);
    const status = state.paidStatus[key];
    return Object.assign({}, i, {key, status});
  });
  noDateEnriched.sort((a,b)=> (a.status==='paid')===(b.status==='paid') ? 0 : (a.status==='paid'?-1:1));
  const noDateHtml = noDateEnriched.length
    ? `<div class="card">${noDateEnriched.map(itemRowHtmlNoDate).join('')}</div>`
    : `<div class="empty">Aucune dépense sans date de prélèvement.</div>`;

  document.getElementById('content').innerHTML = `
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <div class="label">${MOIS[viewMonth.getMonth()]} ${viewMonth.getFullYear()}</div>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="card hero">
      <div class="total-label">Charge mensuel</div>
      <div class="total-amount">${fmt(total)}</div>
      <div class="reste-line">Reste à débiter : <b>${fmt(reste)}</b></div>
      <div class="breakdown">
        <span>Mensuelles <b>${fmt(byType.Mensuelle)}</b></span>
        <span>Annuelles <b>${fmt(byType.Annuelle)}</b></span>
        <span>Exceptionnel <b>${fmt(exceptTotal)}</b></span>
      </div>
      ${pieHtml}
    </div>
    <div class="card hero">
      <div class="total-label">Pépette du mois</div>
      <div class="total-amount">${fmt(pepette)}</div>
      <div class="pepette-row"><span>Salaire du mois</span><input type="number" step="0.01" class="solde-input" value="${solde||''}" placeholder="0" onchange="updateSolde(this.value)"></div>
      ${revenusForMonth.length ? `<div class="revenu-list">${revenusForMonth.map(r=>`<div class="revenu-item"><span>${escapeHtml(r.nom)}</span><span>${fmt(r.montant)}</span><button class="del" onclick="deleteRevenu('${r.id}')">×</button></div>`).join('')}</div>` : ''}
      ${showRevenuForm ? `
        <form class="mini" onsubmit="submitRevenu(event)">
          <div class="grid2"><input required id="r-nom" placeholder="Nom (prime, cadeau…)"><input required id="r-montant" type="number" step="0.01" placeholder="Montant €"></div>
          <div class="actions"><button type="submit" class="btn small">Ajouter</button><button type="button" class="btn secondary small" onclick="toggleRevenuForm()">Annuler</button></div>
        </form>` : `<button class="btn secondary small" onclick="toggleRevenuForm()">+ Revenu exceptionnel</button>`}
    </div>
    <div class="section-title echeance-toggle" onclick="toggleEcheances()"><span>Échéances du cycle</span><span class="chev">${echeancesOpen?'▲ réduire':'▼ voir tout'}</span></div>
    <div class="card">${rowsHtml}</div>
    <div class="section-title">Sans date de prélèvement</div>
    ${noDateHtml}
  `;
}

function newCategory(){ showCategoryForm=true; editingCategoryName=null; showChargeForm=false; editingCharge=null; openMenuFor=null; renderCharges(); }
function startEditCategory(name){ editingCategoryName=name; showCategoryForm=false; editingCharge=null; openMenuFor=null; renderCharges(); }
function cancelCategory(){ showCategoryForm=false; editingCategoryName=null; renderCharges(); }
function submitCategory(ev){
  ev.preventDefault();
  const nom = document.getElementById('cat-nom').value.trim();
  const couleur = document.getElementById('cat-couleur').value;
  if(!nom || !couleur) return;
  if(editingCategoryName){
    const existing = (state.categories||[]).find(c=>c.name===editingCategoryName);
    const nameChanged = nom !== editingCategoryName;
    if(nameChanged && getChargeCategories().some(c=>c.toLowerCase()===nom.toLowerCase())){ alert('Cette catégorie existe déjà.'); return; }
    if(existing){ existing.name=nom; existing.color=couleur; }
    if(nameChanged){ state.charges.forEach(c=>{ if(c.categorie===editingCategoryName) c.categorie=nom; }); }
    editingCategoryName=null;
  } else {
    if(getChargeCategories().some(c=>c.toLowerCase()===nom.toLowerCase())){ alert('Cette catégorie existe déjà.'); return; }
    if(!state.categories) state.categories=[];
    state.categories.push({name:nom, color:couleur});
  }
  save(); showCategoryForm=false; renderCharges();
}
function deleteCategory(name){
  askConfirm('Supprimer cette catégorie ? Les charges associées passeront dans "Autre".', ()=>{
    state.charges.forEach(c=>{ if(c.categorie===name) c.categorie='Autre'; });
    state.categories = (state.categories||[]).filter(c=>c.name!==name);
    editingCategoryName=null; openMenuFor=null;
    save(); renderCharges();
  });
}

function renderCharges(){
  const rowHtml = c => {
    const menuKey = 'chargerow_'+c.id;
    const menuOpen = openMenuFor===menuKey;
    const row = `
    <div class="row">
      ${c.jour?`<div class="day-badge">${String(c.jour).padStart(2,'0')}</div>`:''}
      <div class="row-main">
        <div class="row-name">${escapeHtml(c.nom)}</div>
        <div class="row-sub">${c.frequence==='annuel'?('chaque '+MOIS[c.mois-1]):'chaque mois'}</div>
      </div>
      <div class="row-amount">${fmt(c.montant)}</div>
      <div class="menu-wrap">
        <button class="icon-btn ghost" onclick="toggleMenu('${menuKey}')">⋮</button>
        ${menuOpen ? `<div class="menu"><button onclick="startEditCharge('${c.id}')">Modifier</button><button onclick="deleteCharge('${c.id}')">Supprimer</button></div>` : ''}
      </div>
    </div>`;
    const inline = (editingCharge && editingCharge.id===c.id) ? chargeForm(editingCharge) : '';
    return row + inline;
  };
  const cycleOrder = jour => ((jour - (state.payday||25) + 31) % 31);
  const chargesSansEpargne = state.charges.filter(c=>(c.categorie||'Autre')!=='Épargne');
  const monthItems = itemsForMonth(viewMonth);
  const catTotals = {};
  monthItems.forEach(i=>{ if(i.kind==='charge'){ const cat=i.categorie||'Autre'; catTotals[cat]=(catTotals[cat]||0)+i.montant; } });
  const groups = getChargeCategories().map(cat=>({cat, items: chargesSansEpargne.filter(c=>(c.categorie||'Autre')===cat).slice().sort((a,b)=>cycleOrder(+a.jour)-cycleOrder(+b.jour))})).filter(g=>g.items.length);
  const totalCharges = Object.keys(catTotals).filter(c=>c!=='Épargne').reduce((s,c)=>s+catTotals[c],0);
  let body = !chargesSansEpargne.length
    ? `<div class="empty"><strong>Aucune charge enregistrée</strong>Ajoute tes mensualités et charges annuelles pour suivre leurs échéances.</div>`
    : groups.map(g=>{
        const c = getCatInfo(g.cat);
        const tot = catTotals[g.cat]||0;
        const catMenuKey = 'catrow_'+g.cat;
        const catMenuOpen = openMenuFor===catMenuKey;
        const catMenu = `
          <div class="menu-wrap">
            <button class="icon-btn ghost" onclick="toggleMenu('${catMenuKey}')">⋮</button>
            ${catMenuOpen ? `<div class="menu"><button onclick="startEditCategory('${g.cat}')">Modifier</button><button onclick="deleteCategory('${g.cat}')">Supprimer</button></div>` : ''}
          </div>`;
        const header = `<div class="section-title cat-section" style="color:${c.text}"><span class="cat-dot" style="background:${c.dot}"></span><span style="flex:1">${g.cat}</span><span>${fmt(tot)}</span>${catMenu}</div>`;
        const catInlineForm = editingCategoryName===g.cat ? categoryForm((state.categories||[]).find(cc=>cc.name===g.cat)) : '';
        return header + catInlineForm + `<div class="card">${g.items.map(rowHtml).join('')}</div>`;
      }).join('');
  document.getElementById('content').innerHTML = `
    <div class="card hero">
      <div class="total-label">Total des charges du mois</div>
      <div class="total-amount">${fmt(totalCharges)}</div>
    </div>
    <div class="fab-row" style="gap:8px">
      <button class="btn secondary" onclick="newCategory()">+ Nouvelle catégorie</button>
      <button class="btn" onclick="newCharge()">+ Ajouter une charge</button>
    </div>
    ${showCategoryForm ? categoryForm(null) : ''}
    ${showChargeForm ? chargeForm(editingCharge) : ''}
    ${body}
  `;
}

function startEditCharge(id){ editingCharge = state.charges.find(c=>c.id===id); showChargeForm=false; showCategoryForm=false; editingCategoryName=null; openMenuFor=null; renderCharges(); }

    const row = `
    <div class="row">
      ${e.jour?`<div class="day-badge">${String(e.jour).padStart(2,'0')}</div>`:''}
      <div class="row-main">
        <div class="row-name">${escapeHtml(e.nom)}</div>
        <div class="row-sub">${escapeHtml(e.typeEpargne||'Autre')}${e.frequence==='unique' ? (' · '+MOIS[+e.moisUnique.split('-')[1]-1]+' '+e.moisUnique.split('-')[0]) : ' · chaque mois'}</div>
      </div>
      <div class="row-amount">${fmt(e.montant)}</div>
      <div class="menu-wrap">
        <button class="icon-btn ghost" onclick="toggleMenu('${menuKey}')">⋮</button>
        ${menuOpen ? `<div class="menu"><button onclick="${editFn}('${e.id}')">Modifier</button><button onclick="deleteCharge('${e.id}')">Supprimer</button></div>` : ''}
      </div>
    </div>`;
    const inline = (editingEpargne && editingEpargne.id===e.id) ? (e.frequence==='unique' ? epargneExceptForm(editingEpargne) : epargneMensuelForm(editingEpargne)) : '';
    return row + inline;
  };
  const body = !epargnes.length
    ? `<div class="empty"><strong>Aucune épargne enregistrée</strong>Ajoute une épargne mensuelle ou ponctuelle pour la suivre ici.</div>`
    : `
      ${mensuelles.length?`<div class="section-title">Mensuelle</div><div class="card">${mensuelles.map(e=>rowHtml(e,'editEpargneMensuel')).join('')}</div>`:''}
      ${exceptionnelles.length?`<div class="section-title">Exceptionnelle</div><div class="card">${exceptionnelles.map(e=>rowHtml(e,'editEpargneExcept')).join('')}</div>`:''}
    `;
  document.getElementById('content').innerHTML = `
    <div class="card hero">
      <div class="total-label">Total épargne du mois</div>
      <div class="total-amount">${fmt(total)}</div>
    </div>
    <div class="fab-row" style="gap:8px">
      <button class="btn secondary" onclick="newEpargneExcept()">+ Épargne exceptionnelle</button>
      <button class="btn" onclick="newEpargneMensuel()">+ Épargne mensuelle</button>
    </div>
    ${showEpargneMensuelForm ? epargneMensuelForm(editingEpargne) : ''}
    ${showEpargneExceptForm ? epargneExceptForm(editingEpargne) : ''}
    ${body}
  `;
}

function exceptForm(e){
  return `
  <form class="entry" onsubmit="submitExcept(event)">
    <div class="field"><label>Nom de la dépense</label><input required id="e-nom" value="${e?escapeHtml(e.nom):''}" placeholder="Réparation voiture, remboursement…"></div>
    <div class="grid2">
      <div class="field"><label>Montant / mois (€)</label><input required id="e-montant" type="number" step="0.01" min="0" value="${e?e.montant:''}"></div>
      <div class="field"><label>Durée (mois)</label><input required id="e-duree" type="number" min="1" value="${e?e.duree:''}"></div>
    </div>
    <div class="field"><label>Mois de départ</label><input required id="e-mois" type="month" value="${e?e.moisDebut:''}"></div>
    ${jourFieldHtml('e-jour', e?e.jour:'', {label:'Jour de prélèvement'})}
    <div class="actions">
      <button type="submit" class="btn">${e?'Enregistrer':'Ajouter'}</button>
      <button type="button" class="btn secondary" onclick="cancelExcept()">Annuler</button>
    </div>
  </form>`;
}
function renderExcept(){
  const cc = currentCycle(); const curIdx = cc.year*12+(cc.month-1);
  const withStatus = state.exceptionnelles.map(e=>{
    const [y,m] = e.moisDebut.split('-').map(Number);
    const startIdx = y*12+(m-1); const offset = curIdx-startIdx;
    const status = offset<0 ? 'à venir' : (offset<+e.duree ? 'actif' : 'terminé');
    return Object.assign({}, e, {y, m, offset, status});
  });
  const actifs = withStatus.filter(e=>e.status!=='terminé');
  const archives = withStatus.filter(e=>e.status==='terminé');
  const rowHtml = e => {
    const menuKey = 'exceptrow_'+e.id;
    const menuOpen = openMenuFor===menuKey;
    const row = `
    <div class="row">
      ${e.jour?`<div class="day-badge">${String(e.jour).padStart(2,'0')}</div>`:''}
      <div class="row-main">
        <div class="row-name">${escapeHtml(e.nom)}</div>
        <div class="row-sub">à partir de ${MOIS[e.m-1]} ${e.y} · ${e.duree} mois</div>
      </div>
      <span class="tag ${e.status==='actif'?'':'warn'}">${e.status==='actif'?('mois '+(e.offset+1)+'/'+e.duree):e.status}</span>
      <div class="row-amount">${fmt(e.montant)}</div>
      <div class="menu-wrap">
        <button class="icon-btn ghost" onclick="toggleMenu('${menuKey}')">⋮</button>
        ${menuOpen ? `<div class="menu"><button onclick="editExcept('${e.id}')">Modifier</button><button onclick="deleteExcept('${e.id}')">Supprimer</button></div>` : ''}
      </div>
    </div>`;
    const inline = (editingExcept && editingExcept.id===e.id) ? exceptForm(editingExcept) : '';
    return row + inline;
  };
  const archiveRowHtml = e => `
    <div class="row">
      ${e.jour?`<div class="day-badge">${String(e.jour).padStart(2,'0')}</div>`:''}
      <div class="row-main"><div class="row-name">${escapeHtml(e.nom)}</div><div class="row-sub">${MOIS[e.m-1]} ${e.y} · ${e.duree} mois · terminé</div></div>
      <div class="row-amount">${fmt(e.montant)}</div>
      <button class="del" onclick="deleteExcept('${e.id}')">×</button>
    </div>`;
  const totalExcept = actifs.reduce((s,e)=>s+ +e.montant,0);
  const mainBody = actifs.length
    ? `<div class="card">${actifs.map(rowHtml).join('')}</div>`
    : `<div class="empty"><strong>Aucune dépense exceptionnelle en cours</strong>Ajoute une dépense ponctuelle répartie sur plusieurs mois — un remboursement, une réparation…</div>`;
  const archiveBody = archives.length
    ? `<div class="card archive-card">${archives.map(archiveRowHtml).join('')}</div>`
    : `<div class="card archive-card"><div class="muted">Aucune dépense archivée pour l'instant.</div></div>`;
  document.getElementById('content').innerHTML = `
    <div class="card hero">
      <div class="total-label">Total exceptionnel du mois</div>
      <div class="total-amount">${fmt(totalExcept)}</div>
    </div>
    <div class="fab-row"><button class="btn" onclick="newExcept()">+ Ajouter une dépense</button></div>
    ${showExceptForm ? exceptForm(editingExcept) : ''}
    ${mainBody}
    <div class="section-title">Archive</div>
    ${archiveBody}
  `;
}
function newExcept(){ editingExcept=null; showExceptForm=true; openMenuFor=null; renderExcept(); }
function editExcept(id){ editingExcept = state.exceptionnelles.find(e=>e.id===id); showExceptForm=false; openMenuFor=null; renderExcept(); }
function cancelExcept(){ showExceptForm=false; editingExcept=null; renderExcept(); }
function deleteExcept(id){
  askConfirm('Supprimer cette dépense ?', ()=>{
    state.exceptionnelles = state.exceptionnelles.filter(e=>e.id!==id);
    save(); renderExcept();
  });
}
function submitExcept(ev){
  ev.preventDefault();
  const nom = document.getElementById('e-nom').value.trim();
  const montant = document.getElementById('e-montant').value;
  const duree = document.getElementById('e-duree').value;
  const moisDebut = document.getElementById('e-mois').value;
  const jour = readJourField('e-jour');
  if(!nom || !montant || !duree || !moisDebut) return;
  if(editingExcept){ Object.assign(editingExcept, {nom, montant, duree, moisDebut, jour}); }
  else{ state.exceptionnelles.push({id:uid(), nom, montant, duree, moisDebut, jour}); }
  save(); showExceptForm=false; editingExcept=null; renderExcept();
}

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function render(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  if(tab==='apercu') renderApercu(); else if(tab==='charges') renderCharges(); else if(tab==='epargne') renderEpargne(); else renderExcept();
}

const TAB_ORDER = ['apercu','charges','epargne','except'];
let tabAnimating = false;
function switchTab(newTab, direction){
  if(newTab===tab || tabAnimating) return;
  openMenuFor=null; showEpargneMensuelForm=false; showEpargneExceptForm=false;
  tabAnimating = true;
  const contentEl = document.getElementById('content');
  const parent = contentEl.parentNode;
  const wrapper = document.createElement('div');
  wrapper.style.position = 'relative';
  wrapper.style.overflow = 'hidden';
  wrapper.style.maxWidth = '520px';
  wrapper.style.margin = '0 auto';
  const clone = contentEl.cloneNode(true);
  clone.removeAttribute('id');
  clone.style.position = 'absolute';
  clone.style.top = '0';
  clone.style.left = '0';
  clone.style.width = '100%';
  clone.style.margin = '0';
  clone.style.zIndex = '1';
  parent.insertBefore(wrapper, contentEl);
  wrapper.appendChild(contentEl);
  wrapper.appendChild(clone);
  contentEl.style.position = 'relative';
  contentEl.style.margin = '0';
  contentEl.style.zIndex = '2';
  contentEl.style.transform = `translateX(${direction*100}%)`;
  contentEl.style.transition = 'none';
  tab = newTab;
  render();
  void contentEl.offsetWidth;
  requestAnimationFrame(()=>{
    contentEl.style.transition = 'transform .3s ease';
    clone.style.transition = 'transform .3s ease';
    contentEl.style.transform = 'translateX(0)';
    clone.style.transform = `translateX(${-direction*100}%)`;
  });
  setTimeout(()=>{
    clone.remove();
    parent.insertBefore(contentEl, wrapper);
    wrapper.remove();
    contentEl.style.position = '';
    contentEl.style.margin = '';
    contentEl.style.zIndex = '';
    contentEl.style.transform = '';
    contentEl.style.transition = '';
    tabAnimating = false;
  }, 320);
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click', ()=>{
  const newTab = b.dataset.tab;
  if(newTab===tab) return;
  const oldIdx = TAB_ORDER.indexOf(tab), newIdx = TAB_ORDER.indexOf(newTab);
  switchTab(newTab, newIdx>oldIdx ? 1 : -1);
}));

let swipeStartX=0, swipeStartY=0, swiping=false;
const swipeTarget = document.getElementById('content');
swipeTarget.addEventListener('touchstart', e=>{
  if(e.touches.length!==1 || tabAnimating) return;
  swipeStartX = e.touches[0].clientX;
  swipeStartY = e.touches[0].clientY;
  swiping = true;
}, {passive:true});
swipeTarget.addEventListener('touchend', e=>{
  if(!swiping) return;
  swiping = false;
  const dx = e.changedTouches[0].clientX - swipeStartX;
  const dy = e.changedTouches[0].clientY - swipeStartY;
  if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.4){
    const idx = TAB_ORDER.indexOf(tab);
    let newIdx, direction;
    if(dx < 0){ newIdx = (idx+1) % TAB_ORDER.length; direction = 1; }
    else { newIdx = (idx-1+TAB_ORDER.length) % TAB_ORDER.length; direction = -1; }
    switchTab(TAB_ORDER[newIdx], direction);
  }
}, {passive:true});

render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
</body>
</html>
